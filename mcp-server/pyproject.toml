[project]
name = "rhino-mcp"
version = "0.2.0"
description = "Rhino 8 + Grasshopper integration through the Model Context Protocol"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "mcp[cli]>=1.3.0",
    "requests",
    "pillow",
]

[project.scripts]
rhino-mcp = "rhino_mcp.server:main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"
